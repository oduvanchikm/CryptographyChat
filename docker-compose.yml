networks:
  securechat_network:
    name: securechatsolution_securechat_network
    driver: bridge

services:
  securechat.server:
    networks:
      - securechat_network
    image: securechat-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_CONNECTION: redis:6379
    volumes:
      - aspnet-data-protection-keys:/root/.aspnet/DataProtection-Keys
    build:
      context: .
      dockerfile: SecureChat.Server/Dockerfile
    ports:
      - "5079:8080"
    depends_on:
      - securechat.database
      - kafka
  
  securechat.database:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securechat_network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2185:2181"
    networks:
      - securechat_network

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      
      KAFKA_MESSAGE_MAX_BYTES: 10485760  
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 10485760
      KAFKA_MAX_PARTITION_FETCH_BYTES: 10485760
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 10485760
    ports:
      - "9097:9092"
    networks:
      - securechat_network
  
  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    networks:
      - securechat_network
        
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    networks:
      - securechat_network
    depends_on:
      - proxy-server
    environment:
      - REACT_APP_API_BASE_URL=http://proxy-server:3001/api
  
  proxy-server:
    build:
      context: ./proxy-server
    env_file:
      - ./proxy-server/proxy-server.env
    ports:
      - "3001:3001"
    networks:
      - securechat_network
    depends_on:
      - securechat.server

volumes:
  postgres_data:
  aspnet-data-protection-keys: